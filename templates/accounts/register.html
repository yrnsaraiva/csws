<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Prime Coaching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
                dark: { DEFAULT: '#0f172a', card: '#1e293b', surface: '#334155', border: '#475569' }
            }}}
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-dark flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand-600/30">
                <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Criar Conta</h1>
            <p class="text-gray-500 text-sm mt-1">Preencha os seus dados</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            {% if form.errors %}
            <div class="bg-red-600/10 border border-red-600/30 rounded-xl p-3">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <p class="text-sm text-red-400">{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Nome</label>
                    <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}" required
                        class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="Nome">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Apelido</label>
                    <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}" required
                        class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="Apelido">
                </div>
            </div>

            <div>
                <label class="text-sm font-medium text-gray-300 mb-1.5 block">Email</label>
                <input type="email" name="email" value="{{ form.email.value|default:'' }}" required
                    class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                    placeholder="seu@email.com">
            </div>

            <div>
                <label class="text-sm font-medium text-gray-300 mb-1.5 block">Senha</label>
                <input type="password" name="password1" required
                    class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                    placeholder="••••••••">
            </div>

            <div>
                <label class="text-sm font-medium text-gray-300 mb-1.5 block">Confirmar Senha</label>
                <input type="password" name="password2" required
                    class="w-full bg-dark-card border border-dark-border rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 text-white font-semibold hover:from-brand-500 hover:to-brand-400 transition-all shadow-lg shadow-brand-600/25">
                Criar Conta
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Já tem conta? <a href="{% url 'accounts:login' %}" class="text-brand-400 hover:text-brand-300 font-medium">Entrar</a>
        </p>
    </div>
</body>
</html>
