{% extends "accounts/auth_base.html" %}
{% block title %}Password definida{% endblock %}

{% block subtitle %}
    <p class="text-sm text-gray-300 mt-5">Password definida com sucesso</p>
{% endblock %}

{% block content %}
<div class="bg-dark-card border border-dark-border rounded-xl p-5 text-center space-y-4">
    <p class="text-sm text-gray-300">
        A tua password foi definida. Já podes entrar na tua conta.
    </p>
    <a href="{% url 'accounts:login' %}"
       class="inline-block w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 text-white font-semibold hover:from-brand-500 hover:to-brand-400 transition-all shadow-lg shadow-brand-600/25">
        Entrar
    </a>
</div>
{% endblock %}
