{% extends "base.html" %}
{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="max-w-2xl">

    <a href="{% url 'accounts:profile' %}" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-white mb-3 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Voltar
    </a>
    <h1 class="text-2xl font-bold text-white mb-6">Editar Perfil</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        <!-- User data -->
        <div class="bg-dark-card rounded-2xl border border-dark-border p-6">
            <h3 class="text-sm font-semibold text-gray-400 mb-4">Informações pessoais</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Nome</label>
                    <input type="text" name="first_name" value="{{ user_form.first_name.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Apelido</label>
                    <input type="text" name="last_name" value="{{ user_form.last_name.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Telefone</label>
                    <input type="text" name="phone" value="{{ user_form.phone.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="+258 84 123 4567">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Data de nascimento</label>
                    <input type="date" name="date_of_birth" value="{{ user_form.date_of_birth.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                </div>
                <div class="col-span-full">
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Foto de perfil</label>
                    <input type="file" name="photo" accept="image/*"
                        class="w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-medium file:bg-brand-600 file:text-white hover:file:bg-brand-500 file:cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Client profile data -->
        <div class="bg-dark-card rounded-2xl border border-dark-border p-6">
            <h3 class="text-sm font-semibold text-gray-400 mb-4">Dados físicos</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Altura (cm)</label>
                    <input type="number" step="0.1" name="height_cm" value="{{ profile_form.height_cm.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="175">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Peso (kg)</label>
                    <input type="number" step="0.1" name="weight_kg" value="{{ profile_form.weight_kg.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="75">
                </div>
                <div class="col-span-full">
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Objetivo</label>
                    <input type="text" name="goal" value="{{ profile_form.goal.value|default:'' }}"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
                        placeholder="Ex: ganhar massa muscular">
                </div>
                <div class="col-span-full">
                    <label class="text-sm font-medium text-gray-300 mb-1.5 block">Observações</label>
                    <textarea name="notes" rows="3"
                        class="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent resize-none"
                        placeholder="Lesões, restrições, preferências...">{{ profile_form.notes.value|default:'' }}</textarea>
                </div>
            </div>
        </div>

        <button type="submit"
            class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 text-white font-semibold hover:from-brand-500 hover:to-brand-400 transition-all shadow-lg shadow-brand-600/25">
            Guardar Alterações
        </button>
    </form>
</div>
{% endblock %}
