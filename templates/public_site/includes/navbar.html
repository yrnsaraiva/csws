{% load static %}

<style>
    #navbar {
        background: transparent;
    }

    #navbar.scrolled {
        background: var(--background);
        box-shadow: 0 1px 20px rgba(0, 0, 0, 0.05);
    }

    /* Language Switch */
    .lang-switch {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 4px 2px;
    }

    .lang-switch span {
        font-family: var(--font-body, inherit);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: color 0.2s;
    }

    .lang-switch span.active {
        color: var(--foreground);
    }

    .lang-switch span.inactive {
        color: var(--muted);
    }

    .lang-toggle-track {
        position: relative;
        width: 32px;
        height: 16px;
        border-radius: 8px;
        border: 1px solid rgba(240, 230, 210, 0.25);
        background: rgba(240, 230, 210, 0.08);
        transition: background 0.25s;
        flex-shrink: 0;
    }

    .lang-toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary, #b9c931);
        transition: transform 0.25s cubic-bezier(.4, 0, .2, 1);
    }

    .lang-switch.en .lang-toggle-thumb {
        transform: translateX(16px);
    }

    /* popup overlay hiding class – evita cliques acidentais */
    .popup-hidden {
        display: none !important;
    }
</style>

    let currentLang = localStorage.getItem('lang') || 'pt';

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        const t = window.TRANSLATIONS[lang];
        if (!t) return;

        // Texto simples
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] !== undefined) el.textContent = t[key];
        });

        // Texto com HTML
        document.querySelectorAll('[data-i18n-html]').forEach(el => {
            const key = el.getAttribute('data-i18n-html');
            if (t[key] !== undefined) el.innerHTML = t[key];
        });

        // Actualizar switches de idioma
        document.querySelectorAll('.lang-switch').forEach(sw => {
            const isEn = lang === 'en';
            sw.classList.toggle('en', isEn);
            sw.setAttribute('aria-checked', isEn ? 'true' : 'false');
            sw.setAttribute('aria-label', isEn ? 'Mudar para Português' : 'Switch to English');

            const ptLabel = sw.querySelector('[id^="lbl-pt"]');
            const enLabel = sw.querySelector('[id^="lbl-en"]');
            if (ptLabel && enLabel) {
                if (lang === 'pt') {
                    ptLabel.classList.add('active');
                    ptLabel.classList.remove('inactive');
                    enLabel.classList.add('inactive');
                    enLabel.classList.remove('active');
                } else {
                    enLabel.classList.add('active');
                    enLabel.classList.remove('inactive');
                    ptLabel.classList.add('inactive');
                    ptLabel.classList.remove('active');
                }
            }
        });
    }

    function toggleLang() {
        applyLang(currentLang === 'pt' ? 'en' : 'pt');
    }

    // Popup de selecção de idioma
    function pickLang(lang) {
        applyLang(lang);
        localStorage.setItem('lang_chosen', '1');
        const overlay = document.getElementById('lang-popup-overlay');
        overlay.style.opacity = '0';

        const onTransitionEnd = () => {
            overlay.style.display = 'none';
            overlay.removeEventListener('transitionend', onTransitionEnd);
        };
        overlay.addEventListener('transitionend', onTransitionEnd);

        setTimeout(() => {
            if (overlay.style.opacity === '0') overlay.style.display = 'none';
        }, 500);
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('lang-popup-overlay');
        const alreadyChosen = localStorage.getItem('lang_chosen');

        overlay.style.display = 'none';

        if (alreadyChosen) {
            applyLang(currentLang);
        } else {
            applyLang('pt');
            overlay.style.display = 'flex';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    overlay.style.opacity = '1';
                });
            });
        }
    });
