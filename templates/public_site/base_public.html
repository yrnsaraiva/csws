{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cant Stop Wont Stop | Personal Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="shortcut icon" href="{% static 'img/04_icone_verdebranco_fundo_preto.png' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,600;0,900;1,900&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Inter Tight"', "system-ui", "sans-serif"],
                        body: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        primary: 'hsl(66,61%,49%)',
                        background: 'hsl(0,0%,4%)',
                        foreground: 'hsl(60,9%,96%)',
                        card: 'hsl(0,0%,8%)',
                        border: 'hsl(0,0%,16%)',
                        muted: 'hsl(0,0%,55%)',
                        accent: 'hsl(0,0%,14%)',
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --primary: hsl(66, 61%, 49%);
            --background: hsl(0, 0%, 4%);
            --foreground: hsl(60, 9%, 96%);
            --card: hsl(0, 0%, 8%);
            --border: hsl(0, 0%, 16%);
            --muted: hsl(0, 0%, 55%);
        }

        * {
            border-color: var(--border);
        }

        body {
            background: var(--background);
            color: var(--foreground);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-style: italic;
            font-family: 'Inter Tight', system-ui, sans-serif;
            text-transform: uppercase;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: #0a0a0a;
            padding: 0.85rem 2.2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: opacity 0.2s, transform 0.15s;
            text-decoration: none;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:hover {
            opacity: 0.88;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(240, 230, 210, 0.3);
            color: var(--foreground);
            padding: 0.75rem 2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-outline:hover {
            background: rgba(240, 230, 210, 0.05);
        }

        .section-label {
            font-size: 0.7rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: block;
        }

        .section-heading {
            font-style: italic;
            font-family: 'Inter Tight', system-ui, serif;
            font-weight: 400;
            line-height: 0.98;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            color: var(--foreground);
        }

        .section-heading em {
            font-style: italic;
            color: var(--primary);
        }

        /* Reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: none;
        }

        .reveal-delay-1 {
            transition-delay: 0.1s;
        }

        .reveal-delay-2 {
            transition-delay: 0.2s;
        }

        /* Mobile menu */
        #mobile-menu {
            display: none;
        }

        #mobile-menu.open {
            display: block;
        }

        /* Hero animation */
        @keyframes heroScale {
            from {
                transform: scale(1.08);
            }
            to {
                transform: scale(1);
            }
        }

        #hero-img {
            animation: heroScale 1.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .hero-title {
            animation: fadeUp 0.9s 0.3s cubic-bezier(0.25, 0.1, 0.25, 1) both;
        }

        .hero-sub {
            animation: fadeUp 0.8s 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) both;
        }

        .hero-btns {
            animation: fadeUp 0.8s 0.9s cubic-bezier(0.25, 0.1, 0.25, 1) both;
        }

        .hero-scroll {
            animation: fadeUp 0.6s 1.2s ease both;
        }

        /* Booking page hidden by default */
        #page-booking {
            display: none;
        }

        #page-home {
            display: block;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

{% block content %}{% endblock %}


{% block extra_js %}{% endblock %}

<script>
    // ---- PAGE NAVIGATION ----
    let currentBookingStep = 1;
    let selectedService = null;

    const services = {
        online: {label: 'Consulta Online', price: '1.000 MT'},
        consultorio: {label: 'No Consultório', price: '2.000 MT'},
        domicilio: {label: 'Ao Domicílio', price: '3.000 MT'},
        xpress: {label: 'Consulta Xpress', price: '500 MT'},
        basico: {label: 'Plano Básico', price: '3.500 MT'},
        standard: {label: 'Plano Standard', price: '6.000 MT'},
        premium: {label: 'Plano Premium', price: '9.000 MT'},
    };

    function showHome() {
        document.getElementById('page-home').style.display = 'block';
        document.getElementById('page-booking').style.display = 'none';
        window.scrollTo(0, 0);
        updateNavbar();
    }

    function showBooking() {
        document.getElementById('page-home').style.display = 'none';
        document.getElementById('page-booking').style.display = 'block';
        currentBookingStep = 1;
        selectedService = null;
        document.querySelectorAll('input[name="service"]').forEach(r => r.checked = false);
        document.querySelectorAll('.service-card').forEach(c => resetCard(c));
        document.getElementById('booking-step1').style.display = 'block';
        document.getElementById('booking-step2').style.display = 'none';
        document.getElementById('btn-back').style.display = 'none';
        document.getElementById('btn-back-spacer').style.display = 'block';
        document.getElementById('btn-next').textContent = 'Continuar';
        setNextBtn(false);
        updateStepUI();
        window.scrollTo(0, 0);
        updateNavbar(true);
    }

    function updateNavbar(booking) {
        const nb = document.getElementById('navbar');
        if (booking) {
            nb.style.background = 'rgba(10,10,10,0.9)';
            nb.style.backdropFilter = 'blur(12px)';
        } else {
            nb.style.background = 'transparent';
            nb.style.backdropFilter = '';
        }
    }

    // ---- NAVBAR SCROLL ----
    window.addEventListener('scroll', () => {
        const nb = document.getElementById('navbar');
        if (document.getElementById('page-booking').style.display === 'block') return;
        if (window.scrollY > 60) {
            nb.style.background = 'rgba(10,10,10,0.92)';
            nb.style.backdropFilter = 'blur(12px)';
        } else {
            nb.style.background = 'transparent';
            nb.style.backdropFilter = '';
        }
    });

    // ---- MOBILE MENU ----
    function toggleMenu() {
        const m = document.getElementById('mobile-menu');
        const ic = document.getElementById('icon-close');
        const im = document.getElementById('icon-menu');
        m.classList.toggle('open');
        ic.classList.toggle('hidden');
        im.classList.toggle('hidden');
    }

    // ---- SCROLL REVEAL ----
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                e.target.classList.add('visible');
            }
        });
    }, {threshold: 0.12});
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // ---- SERVICE CARDS ----
    function resetCard(card) {
        card.style.borderColor = 'var(--border)';
        card.style.background = 'var(--card)';
        const icon = card.querySelector('svg');
        if (icon) icon.style.color = 'var(--muted)';
    }

    document.querySelectorAll('.service-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('.service-card').forEach(resetCard);
            card.style.borderColor = 'var(--primary)';
            card.style.background = 'rgba(185,201,49,0.08)';
            const icon = card.querySelector('svg');
            if (icon) icon.style.color = 'var(--primary)';
            selectedService = card.dataset.id;
            setNextBtn(true);
        });
    });

    function setNextBtn(enabled) {
        const btn = document.getElementById('btn-next');
        btn.disabled = !enabled;
        btn.style.opacity = enabled ? '1' : '0.4';
        btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
    }

    // ---- BOOKING STEPS ----
    function updateStepUI() {
        const s1d = document.getElementById('step-1-dot');
        const s2d = document.getElementById('step-2-dot');
        const line = document.getElementById('step-line');
        const s1l = document.getElementById('step-1-label');
        const s2l = document.getElementById('step-2-label');
        if (currentBookingStep === 1) {
            s1d.style.background = 'var(--primary)';
            s1d.style.color = '#0a0a0a';
            s1d.textContent = '1';
            s2d.style.background = 'hsl(0,0%,15%)';
            s2d.style.color = 'var(--muted)';
            s2d.textContent = '2';
            line.style.background = 'var(--border)';
            s1l.style.color = 'var(--foreground)';
            s2l.style.color = 'var(--muted)';
        } else {
            s1d.style.background = 'var(--primary)';
            s1d.style.color = '#0a0a0a';
            s1d.innerHTML = '✓';
            s2d.style.background = 'var(--primary)';
            s2d.style.color = '#0a0a0a';
            s2d.textContent = '2';
            line.style.background = 'var(--primary)';
            s1l.style.color = 'var(--foreground)';
            s2l.style.color = 'var(--foreground)';
        }
    }

    function bookingNext() {
        if (currentBookingStep === 1 && selectedService) {
            currentBookingStep = 2;
            document.getElementById('booking-step1').style.display = 'none';
            document.getElementById('booking-step2').style.display = 'block';
            document.getElementById('btn-back').style.display = 'inline-flex';
            document.getElementById('btn-back-spacer').style.display = 'none';
            document.getElementById('btn-next').textContent = 'Confirmar Agendamento';
            // Fill summary
            const svc = services[selectedService];
            document.getElementById('summary-service').textContent = svc.label;
            document.getElementById('summary-price').textContent = svc.price;
            updateStepUI();
            setNextBtn(false);
            // Watch form fields
            watchForm();
            window.scrollTo(0, 200);
        } else if (currentBookingStep === 2) {
            if (formIsValid()) {
                alert('Agendamento enviado! Entraremos em contacto em breve.');
                showHome();
            }
        }
    }

    function bookingBack() {
        currentBookingStep = 1;
        document.getElementById('booking-step1').style.display = 'block';
        document.getElementById('booking-step2').style.display = 'none';
        document.getElementById('btn-back').style.display = 'none';
        document.getElementById('btn-back-spacer').style.display = 'block';
        document.getElementById('btn-next').textContent = 'Continuar';
        updateStepUI();
        setNextBtn(!!selectedService);
    }

    function formIsValid() {
        return document.getElementById('f-name').value.trim() &&
            document.getElementById('f-email').value.trim() &&
            document.getElementById('f-phone').value.trim() &&
            document.getElementById('f-date').value &&
            document.getElementById('f-time').value;
    }

    function watchForm() {
        ['f-name', 'f-email', 'f-phone', 'f-date', 'f-time'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => setNextBtn(formIsValid()));
        });
    }
</script>
</body>
</html>
